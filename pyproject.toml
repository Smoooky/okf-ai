[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-ai"
version = "0.1.0"
description = "Keep instructions for AI agents (AGENTS.md, CLAUDE.md, Cursor rules) and OKF v0.2 knowledge in step with the code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
okf = "okf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
