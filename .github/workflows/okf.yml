name: OKF knowledge check

on:
  pull_request:
  push:
    branches: [main]

env:
  OKF_BUNDLE: examples/demo  # knowledge bundle to check

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q

  knowledge:
    name: Validate knowledge bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # sticky PR comment with the report
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # stale needs the base branch history for git merge-base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install okf
        run: pip install .

      - name: okf validate
        id: validate
        run: |
          set +e
          okf validate "$OKF_BUNDLE" --format github 2> /dev/null  # annotations in the PR
          okf validate "$OKF_BUNDLE" > validate.txt 2> validate-summary.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat validate.txt validate-summary.txt

      - name: okf stale
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=()
          if [ -n "$BASE_REF" ]; then args=(--base "origin/$BASE_REF"); fi
          okf stale "$OKF_BUNDLE" "${args[@]}" --format github 2> /dev/null
          okf stale "$OKF_BUNDLE" "${args[@]}" > stale.txt 2> stale-summary.txt
          cat stale.txt stale-summary.txt

      - name: Build report
        if: always()
        env:
          VALIDATE_EXIT: ${{ steps.validate.outputs.exit }}
        run: |
          touch validate.txt validate-summary.txt stale.txt stale-summary.txt
          section() {  # title, output file, summary file
            echo "### $1"
            echo
            echo "$(cat "$3")"
            echo
            if [ -s "$2" ]; then echo '```text'; cat "$2"; echo '```'; else echo "No issues."; fi
            echo
          }
          if [ "$VALIDATE_EXIT" = "0" ]; then validate_title="✅ okf validate"; else validate_title="❌ okf validate"; fi
          if grep -q '^\[WARNING\]' stale.txt; then stale_title="⚠️ okf stale: documents may be outdated"; else stale_title="✅ okf stale"; fi
          {
            echo "<!-- okf-ai-report -->"
            echo "## OKF knowledge check: \`$OKF_BUNDLE\`"
            echo
            section "$validate_title" validate.txt validate-summary.txt
            section "$stale_title" stale.txt stale-summary.txt
          } > okf-report.md
          cat okf-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('okf-report.md', 'utf8');
            const marker = '<!-- okf-ai-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on validation errors
        if: steps.validate.outputs.exit != '0'
        run: |
          echo "okf validate found errors, see the job summary"
          exit 1
