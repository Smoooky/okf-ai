# Written by `okf init` (okf-ai): checks agent instructions and the OKF knowledge on every pull request.
name: OKF knowledge check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1-5"  # okf notify, weekdays 07:00 UTC; it sends only with a webhook secret
  workflow_dispatch:
    inputs:
      okf-auto-pr:
        description: Open or update an [OKF-Update] pull request with okf fix --pr
        type: boolean
        default: false

env:
  OKF_REPO: .  # where agent instructions (AGENTS.md, CLAUDE.md, ...) live
  OKF_AGENTS_ARGS: ""  # --strict makes broken paths and commands fail the check
  OKF_BUNDLE: knowledge  # knowledge bundle to check
  OKF_VALIDATE_ARGS: ""  # plain OKF v0.2; --strict adds the okf-ai team rules (verified, stale_after, ...)

jobs:
  knowledge:
    name: Agent instructions and knowledge
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # sticky PR comment with the report
    env:
      BASE_REF: ${{ github.base_ref }}
      # Optional connectors for sources outside git (Confluence, Jira, Notion, pinned Slack messages):
      # without them nothing changes and nothing is requested.
      OKF_CONFLUENCE_URL: ${{ vars.OKF_CONFLUENCE_URL }}
      OKF_JIRA_URL: ${{ vars.OKF_JIRA_URL }}
      OKF_ATLASSIAN_EMAIL: ${{ vars.OKF_ATLASSIAN_EMAIL }}
      OKF_ATLASSIAN_TOKEN: ${{ secrets.OKF_ATLASSIAN_TOKEN }}
      OKF_ATLASSIAN_PAT: ${{ secrets.OKF_ATLASSIAN_PAT }}
      OKF_NOTION_TOKEN: ${{ secrets.OKF_NOTION_TOKEN }}
      OKF_SLACK_TOKEN: ${{ secrets.OKF_SLACK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git merge-base needs the base branch history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install okf
        run: |
          pip install "okf-ai[llm] @ git+https://github.com/Smoooky/okf-ai"
          if [ -n "$BASE_REF" ]; then
            echo "OKF_BASE_ARGS=--base origin/$BASE_REF" >> "$GITHUB_ENV"
            echo "OKF_SINCE_ARGS=--since origin/$BASE_REF" >> "$GITHUB_ENV"
          fi

      - name: okf trust
        run: |  # in a PR: the sections this change makes to recheck; on push: the whole map
          okf trust "$OKF_REPO" $OKF_SINCE_ARGS --format github 2> /dev/null
          okf trust "$OKF_REPO" $OKF_SINCE_ARGS --html report.html > trust.txt 2> trust-summary.txt
          cat trust-summary.txt trust.txt

      - name: Upload the trust map page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okf-trust-report
          path: report.html
          if-no-files-found: ignore

      - name: okf fix
        env:  # drafts only when the repository sets a key; fork PRs get no secrets and skip them
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OKF_LLM_API_KEY: ${{ secrets.OKF_LLM_API_KEY }}
          OKF_LLM_BASE_URL: ${{ vars.OKF_LLM_BASE_URL }}
          OKF_LLM_MODEL: ${{ vars.OKF_LLM_MODEL }}
        run: |  # proposals only: this workflow never commits or opens a pull request
          draft=""  # the same keys okf fix --draft needs: Anthropic, or all three OKF_LLM_* settings
          if [ -n "$ANTHROPIC_API_KEY" ]; then draft="--draft"; fi
          if [ -n "$OKF_LLM_API_KEY" ] && [ -n "$OKF_LLM_BASE_URL" ] && [ -n "$OKF_LLM_MODEL" ]; then draft="--draft"; fi
          okf fix "$OKF_REPO" $draft $OKF_SINCE_ARGS > fix.diff 2> fix-summary.txt
          if [ -z "$draft" ]; then
            echo "LLM drafts skipped: set the ANTHROPIC_API_KEY secret, or OKF_LLM_API_KEY with OKF_LLM_BASE_URL and OKF_LLM_MODEL." >> fix-summary.txt
          fi
          cat fix-summary.txt fix.diff

      - name: okf agents-check
        id: agents_check
        run: |
          set +e
          okf agents-check "$OKF_REPO" $OKF_AGENTS_ARGS $OKF_BASE_ARGS --format github 2> /dev/null  # annotations
          okf agents-check "$OKF_REPO" $OKF_AGENTS_ARGS $OKF_BASE_ARGS > agents-check.txt 2> agents-check-summary.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat agents-check.txt agents-check-summary.txt

      - name: okf validate
        id: validate
        run: |
          set +e
          okf validate "$OKF_BUNDLE" $OKF_VALIDATE_ARGS --format github 2> /dev/null
          okf validate "$OKF_BUNDLE" $OKF_VALIDATE_ARGS > validate.txt 2> validate-summary.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat validate.txt validate-summary.txt

      - name: okf stale
        run: |
          okf stale "$OKF_BUNDLE" $OKF_BASE_ARGS --format github 2> /dev/null
          okf stale "$OKF_BUNDLE" $OKF_BASE_ARGS > stale.txt 2> stale-summary.txt
          cat stale.txt stale-summary.txt

      - name: Build report
        if: always()
        env:
          AGENTS_EXIT: ${{ steps.agents_check.outputs.exit }}
          VALIDATE_EXIT: ${{ steps.validate.outputs.exit }}
        run: |
          for name in trust agents-check validate stale fix; do touch "$name.txt" "$name-summary.txt"; done
          touch fix.diff
          section() {  # title, output file, summary file
            echo "### $1"
            echo
            echo "$(cat "$3")"
            echo
            if [ -s "$2" ]; then echo '```text'; cat "$2"; echo '```'; else echo "No issues."; fi
            echo
          }
          title() {  # name, exit code, output file
            if [ "$2" != "0" ]; then echo "❌ $1"
            elif grep -q '^\[WARNING\]' "$3"; then echo "⚠️ $1"
            else echo "✅ $1"; fi
          }
          {
            echo "<!-- okf-ai-report -->"
            echo "## okf-ai: agent instructions \`$OKF_REPO\`, knowledge \`$OKF_BUNDLE\`"
            echo
            if [ -n "$BASE_REF" ]; then trust_title="okf trust: what this PR makes to recheck"; else trust_title="okf trust: trust map"; fi
            section "$(title "$trust_title" 0 trust.txt)" trust.txt trust-summary.txt
            echo "### okf fix: proposed changes (not committed)"
            echo
            echo '```text'; cat fix-summary.txt; echo '```'
            if [ -s fix.diff ]; then echo '```diff'; cat fix.diff; echo '```'; fi
            echo
            section "$(title "okf agents-check: instructions for AI agents" "$AGENTS_EXIT" agents-check.txt)" agents-check.txt agents-check-summary.txt
            section "$(title "okf validate: OKF v0.2 knowledge" "$VALIDATE_EXIT" validate.txt)" validate.txt validate-summary.txt
            section "$(title "okf stale: documents that may be outdated" 0 stale.txt)" stale.txt stale-summary.txt
          } > okf-report.md
          cat okf-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('okf-report.md', 'utf8');
            const marker = '<!-- okf-ai-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on errors
        if: steps.agents_check.outputs.exit != '0' || steps.validate.outputs.exit != '0'
        run: |
          echo "okf found errors, see the job summary"
          exit 1

  auto-pr:
    name: okf fix as a pull request
    # Off by default. On: the repository variable OKF_AUTO_PR=true (every push to main), or a manual run with
    # okf-auto-pr. Settings > Actions > "Allow GitHub Actions to create and approve pull requests" must be on.
    # There is never a second [OKF-Update] pull request: an open one gets the new commit.
    if: (github.event_name == 'push' && vars.OKF_AUTO_PR == 'true') || (github.event_name == 'workflow_dispatch' && inputs['okf-auto-pr'])
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Optional connectors for sources outside git (Confluence, Jira, Notion, pinned Slack messages):
      # without them nothing changes and nothing is requested.
      OKF_CONFLUENCE_URL: ${{ vars.OKF_CONFLUENCE_URL }}
      OKF_JIRA_URL: ${{ vars.OKF_JIRA_URL }}
      OKF_ATLASSIAN_EMAIL: ${{ vars.OKF_ATLASSIAN_EMAIL }}
      OKF_ATLASSIAN_TOKEN: ${{ secrets.OKF_ATLASSIAN_TOKEN }}
      OKF_ATLASSIAN_PAT: ${{ secrets.OKF_ATLASSIAN_PAT }}
      OKF_NOTION_TOKEN: ${{ secrets.OKF_NOTION_TOKEN }}
      OKF_SLACK_TOKEN: ${{ secrets.OKF_SLACK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install okf
        run: pip install "okf-ai[llm] @ git+https://github.com/Smoooky/okf-ai"
      - name: okf fix --pr
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OKF_LLM_API_KEY: ${{ secrets.OKF_LLM_API_KEY }}
          OKF_LLM_BASE_URL: ${{ vars.OKF_LLM_BASE_URL }}
          OKF_LLM_MODEL: ${{ vars.OKF_LLM_MODEL }}
        run: |
          draft=""
          if [ -n "$ANTHROPIC_API_KEY" ]; then draft="--draft"; fi
          if [ -n "$OKF_LLM_API_KEY" ] && [ -n "$OKF_LLM_BASE_URL" ] && [ -n "$OKF_LLM_MODEL" ]; then draft="--draft"; fi
          okf fix "$OKF_REPO" --pr $draft

  notify:
    name: Remind who confirmed what to recheck
    # On the schedule above, and only if a webhook secret is set: OKF_SLACK_WEBHOOK or OKF_TEAMS_WEBHOOK.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OKF_SLACK_WEBHOOK: ${{ secrets.OKF_SLACK_WEBHOOK }}
      OKF_TEAMS_WEBHOOK: ${{ secrets.OKF_TEAMS_WEBHOOK }}
      # Optional connectors for sources outside git (Confluence, Jira, Notion, pinned Slack messages):
      # without them nothing changes and nothing is requested.
      OKF_CONFLUENCE_URL: ${{ vars.OKF_CONFLUENCE_URL }}
      OKF_JIRA_URL: ${{ vars.OKF_JIRA_URL }}
      OKF_ATLASSIAN_EMAIL: ${{ vars.OKF_ATLASSIAN_EMAIL }}
      OKF_ATLASSIAN_TOKEN: ${{ secrets.OKF_ATLASSIAN_TOKEN }}
      OKF_ATLASSIAN_PAT: ${{ secrets.OKF_ATLASSIAN_PAT }}
      OKF_NOTION_TOKEN: ${{ secrets.OKF_NOTION_TOKEN }}
      OKF_SLACK_TOKEN: ${{ secrets.OKF_SLACK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.OKF_SLACK_WEBHOOK != '' || env.OKF_TEAMS_WEBHOOK != ''
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: env.OKF_SLACK_WEBHOOK != '' || env.OKF_TEAMS_WEBHOOK != ''
        with:
          python-version: "3.12"
      - name: okf notify
        if: env.OKF_SLACK_WEBHOOK != '' || env.OKF_TEAMS_WEBHOOK != ''
        run: |
          pip install "okf-ai[llm] @ git+https://github.com/Smoooky/okf-ai"
          okf notify "$OKF_REPO"
